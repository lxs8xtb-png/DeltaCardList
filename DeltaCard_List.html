<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeltaCard List</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

nav {
    background: #dc2626;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
}

nav h1 {
    font-size: 24px;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 25px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #fde047;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

header h2 {
    font-size: 40px;
    margin-bottom: 10px;
}

header p {
    color: #cbd5e1;
}


/* ===== FILTRES ===== */

.filtres {
    width: 90%;
    max-width: 1200px;
    margin: 10px auto 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.filtre {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #374151;
    color: white;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.2s;
}

.filtre:hover {
    background: #4b5563;
}

.filtre.actif {
    background: #dc2626;
}


/* ===== COLLECTION ===== */

.collection {
    width: 90%;
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 30px;
    padding: 30px 0 60px;
}

.carte {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.carte-image {
    width: 100%;
    display: flex;
    justify-content: center;
}

.carte img {
    width: 100%;
    max-width: 250px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease;
}

.carte:hover {
    transform: scale(1.08);
}

.carte:hover img {
    box-shadow: 0 15px 35px rgba(0,0,0,0.8);
}


/* ===== CARTE OBTENUE ===== */

.carte.obtenue img {
    box-shadow:
        0 0 0 4px #22c55e,
        0 8px 25px rgba(34,197,94,0.4);
}


/* ===== CASE OBTENUE ===== */

.case-obtenue {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.checkbox-carte {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #22c55e;
}


/* ===== CARTE CACHÉE ===== */

.carte.cachee {
    display: none;
}


/* ===== VISIONNEUSE ===== */

.visionneuse {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
}

.visionneuse.active {
    display: flex;
}

.visionneuse.dragging {
    cursor: grabbing;
}

#grandeCarte {
    max-width: 80vw;
    max-height: 80vh;
    border-radius: 15px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    transform-origin: center center;
}

.fermer {
    position: fixed;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: white;
    background: rgba(0,0,0,0.5);
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 1002;
}

.fermer:hover {
    background: #dc2626;
}

.controles {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 1002;
}

.controles button {
    background: white;
    color: #111827;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.controles button:hover {
    background: #fde047;
}


/* ===== FOOTER ===== */

footer {
    text-align: center;
    padding: 25px;
    background: #030712;
    color: #94a3b8;
}


/* ===== MOBILE ===== */

@media (max-width: 600px) {

    nav {
        flex-direction: column;
        gap: 15px;
    }

    nav ul {
        gap: 15px;
    }

    header h2 {
        font-size: 30px;
    }

    #grandeCarte {
        max-width: 90vw;
        max-height: 75vh;
    }

    .filtres {
        gap: 7px;
    }

    .filtre {
        padding: 9px 12px;
        font-size: 14px;
    }
}

</style>
</head>


<body>

<!-- ===== NAVIGATION ===== -->

<nav>
    <h1>Toutes les DeltaCards</h1>

    <ul>
        <li><a href="#accueil">Accueil</a></li>
        <li><a href="#collection">Mes cartes</a></li>
        <li><a href="#apropos">À propos</a></li>
    </ul>
</nav>


<!-- ===== ACCUEIL ===== -->

<header id="accueil">

    <h2>🎴 Mes DeltaCards</h2>

    <p>
        Voici toutes les cartes Pokémon que j'ai créées !
    </p>

</header>


<!-- ===== COLLECTION ===== -->

<main id="collection">


    <!-- ===== FILTRES ===== -->

    <div class="filtres">

        <button class="filtre actif" data-filtre="toutes">
            Toutes
        </button>

        <button class="filtre" data-filtre="obtenues">
            ✓ Obtenues
        </button>

        <button class="filtre" data-filtre="non-obtenues">
            ✗ Non obtenues
        </button>

    </div>


    <div class="collection">


        <!-- ===== CARTE 1 ===== -->

        <div class="carte" data-carte="1" data-obtenue="false">

            <div class="carte-image">
                <img src="Delta1.png" alt="Carte Delta 1">
            </div>

            <label class="case-obtenue">

                <input
                    type="checkbox"
                    class="checkbox-carte"
                >

                <span>Obtenue</span>

            </label>

        </div>


        <!-- ===== CARTE 2 ===== -->

        <div class="carte" data-carte="2" data-obtenue="false">

            <div class="carte-image">
                <img src="Delta2.png" alt="Carte Delta 2">
            </div>

            <label class="case-obtenue">

                <input
                    type="checkbox"
                    class="checkbox-carte"
                >

                <span>Obtenue</span>

            </label>

        </div>


        <!-- ===== CARTE 3 ===== -->

        <div class="carte" data-carte="3" data-obtenue="false">

            <div class="carte-image">
                <img src="Delta3.png" alt="Carte Delta 3">
            </div>

            <label class="case-obtenue">

                <input
                    type="checkbox"
                    class="checkbox-carte"
                >

                <span>Obtenue</span>

            </label>

        </div>


        <!-- ===== CARTE 4 ===== -->

        <div class="carte" data-carte="4" data-obtenue="false">

            <div class="carte-image">
                <img src="Delta4.png" alt="Carte Delta 4">
            </div>

            <label class="case-obtenue">

                <input
                    type="checkbox"
                    class="checkbox-carte"
                >

                <span>Obtenue</span>

            </label>

        </div>


    </div>

</main>


<!-- ===== À PROPOS ===== -->

<section id="apropos">

    <header>

        <h2>À propos</h2>

        <p>
            Juste des DeltaCards.
        </p>

    </header>

</section>


<!-- ===== FOOTER ===== -->

<footer>

    Les DeltaCards © 2026

</footer>


<!-- ===== VISIONNEUSE ===== -->

<div class="visionneuse" id="visionneuse">

    <button class="fermer" id="fermer">
        ×
    </button>


    <img
        id="grandeCarte"
        src=""
        alt="Carte agrandie"
    >


    <div class="controles">

        <button id="moins">
            −
        </button>

        <button id="reset">
            Réinitialiser
        </button>

        <button id="plus">
            +
        </button>

    </div>

</div>


<!-- ===== JAVASCRIPT ===== -->

<script>

/* =====================================================
   VISIONNEUSE
   ===================================================== */

const visionneuse =
    document.getElementById("visionneuse");

const grandeCarte =
    document.getElementById("grandeCarte");

const fermer =
    document.getElementById("fermer");

const plus =
    document.getElementById("plus");

const moins =
    document.getElementById("moins");

const reset =
    document.getElementById("reset");


let zoom = 1;

let x = 0;

let y = 0;

let enTrainDeDeplacer = false;

let aBouge = false;

let departX = 0;

let departY = 0;

let dernierX = 0;

let dernierY = 0;


/* ===== AFFICHER LA CARTE ===== */

function afficherCarte() {

    grandeCarte.style.transform =
        "translate(" +
        x +
        "px, " +
        y +
        "px) scale(" +
        zoom +
        ")";

}


/* ===== OUVRIR UNE CARTE ===== */

document
    .querySelectorAll(".carte img")
    .forEach(image => {

        image.addEventListener(
            "click",
            function() {

                grandeCarte.src =
                    this.src;

                zoom = 1;

                x = 0;

                y = 0;

                afficherCarte();

                visionneuse.classList.add(
                    "active"
                );

                document.body.style.overflow =
                    "hidden";

            }
        );

    });


/* ===== FERMER ===== */

function fermerCarte() {

    visionneuse.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

    enTrainDeDeplacer =
        false;

    visionneuse.classList.remove(
        "dragging"
    );

}


fermer.addEventListener(
    "click",
    fermerCarte
);


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            fermerCarte();

        }

    }
);


/* ===== DÉPLACEMENT ===== */

visionneuse.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target.closest("button")
        ) {

            return;

        }

        enTrainDeDeplacer =
            true;

        aBouge = false;

        departX =
            event.clientX;

        departY =
            event.clientY;

        dernierX =
            event.clientX;

        dernierY =
            event.clientY;

        visionneuse.classList.add(
            "dragging"
        );

        visionneuse.setPointerCapture(
            event.pointerId
        );

        event.preventDefault();

    }
);


visionneuse.addEventListener(
    "pointermove",
    function(event) {

        if (!enTrainDeDeplacer) {

            return;

        }

        const dx =
            event.clientX -
            dernierX;

        const dy =
            event.clientY -
            dernierY;


        if (
            Math.abs(
                event.clientX -
                departX
            ) > 3 ||

            Math.abs(
                event.clientY -
                departY
            ) > 3
        ) {

            aBouge = true;

        }


        x += dx;

        y += dy;

        dernierX =
            event.clientX;

        dernierY =
            event.clientY;

        afficherCarte();

    }
);


/* ===== FIN DU DÉPLACEMENT ===== */

function terminerDeplacement(
    event
) {

    if (!enTrainDeDeplacer) {

        return;

    }

    enTrainDeDeplacer =
        false;

    visionneuse.classList.remove(
        "dragging"
    );


    try {

        visionneuse.releasePointerCapture(
            event.pointerId
        );

    }

    catch (e) {}

}


visionneuse.addEventListener(
    "pointerup",
    terminerDeplacement
);


visionneuse.addEventListener(
    "pointercancel",
    terminerDeplacement
);


/* ===== FERMER EN CLIQUANT SUR LE FOND ===== */

visionneuse.addEventListener(
    "click",
    function(event) {

        if (
            event.target !==
            visionneuse
        ) {

            return;

        }


        if (aBouge) {

            aBouge = false;

            return;

        }


        fermerCarte();

    }
);


/* ===== ZOOM + ===== */

plus.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        zoom += 0.25;


        if (zoom > 5) {

            zoom = 5;

        }


        afficherCarte();

    }
);


/* ===== ZOOM - ===== */

moins.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        zoom -= 0.25;


        if (zoom < 0.5) {

            zoom = 0.5;

        }


        afficherCarte();

    }
);


/* ===== RESET ===== */

reset.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        zoom = 1;

        x = 0;

        y = 0;

        afficherCarte();

    }
);


/* ===== MOLETTE ===== */

visionneuse.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        if (event.deltaY < 0) {

            zoom += 0.1;

        }

        else {

            zoom -= 0.1;

        }


        if (zoom < 0.5) {

            zoom = 0.5;

        }


        if (zoom > 5) {

            zoom = 5;

        }


        afficherCarte();

    },
    {
        passive: false
    }
);



/* =====================================================
   COLLECTION
   ===================================================== */

const cartes =
    document.querySelectorAll(".carte");

const boutonsFiltres =
    document.querySelectorAll(".filtre");


let filtreActuel =
    "toutes";


/* ===== CHARGER LA SAUVEGARDE ===== */

function chargerCollection() {

    const sauvegarde =
        JSON.parse(
            localStorage.getItem(
                "deltacards-obtenues"
            ) || "{}"
        );


    cartes.forEach(carte => {

        const numero =
            carte.dataset.carte;

        const checkbox =
            carte.querySelector(
                ".checkbox-carte"
            );


        if (
            sauvegarde[numero] === true
        ) {

            checkbox.checked =
                true;

            carte.dataset.obtenue =
                "true";

            carte.classList.add(
                "obtenue"
            );

        }

    });

}


/* ===== SAUVEGARDER ===== */

function sauvegarderCollection() {

    const sauvegarde = {};


    cartes.forEach(carte => {

        const numero =
            carte.dataset.carte;

        const checkbox =
            carte.querySelector(
                ".checkbox-carte"
            );


        sauvegarde[numero] =
            checkbox.checked;

    });


    localStorage.setItem(
        "deltacards-obtenues",
        JSON.stringify(
            sauvegarde
        )
    );

}


/* ===== APPLIQUER UN FILTRE ===== */

function appliquerFiltre(
    filtre
) {

    cartes.forEach(carte => {

        const obtenue =
            carte.dataset.obtenue ===
            "true";


        if (
            filtre === "toutes"
        ) {

            carte.classList.remove(
                "cachee"
            );

        }


        else if (
            filtre === "obtenues"
        ) {

            carte.classList.toggle(
                "cachee",
                !obtenue
            );

        }


        else if (
            filtre === "non-obtenues"
        ) {

            carte.classList.toggle(
                "cachee",
                obtenue
            );

        }

    });

}


/* ===== CASES À COCHER ===== */

document
    .querySelectorAll(
        ".checkbox-carte"
    )
    .forEach(checkbox => {

        checkbox.addEventListener(
            "change",
            function(event) {

                event.stopPropagation();


                const carte =
                    this.closest(
                        ".carte"
                    );


                carte.dataset.obtenue =
                    this.checked
                        ? "true"
                        : "false";


                carte.classList.toggle(
                    "obtenue",
                    this.checked
                );


                sauvegarderCollection();

                appliquerFiltre(
                    filtreActuel
                );

            }
        );

    });


/* ===== EMPÊCHER L'OUVERTURE
   EN CLIQUANT SUR "OBTENUE" ===== */

document
    .querySelectorAll(
        ".case-obtenue"
    )
    .forEach(label => {

        label.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

            }
        );

    });


/* ===== BOUTONS FILTRES ===== */

boutonsFiltres.forEach(
    bouton => {

        bouton.addEventListener(
            "click",
            function() {

                boutonsFiltres.forEach(
                    btn => {

                        btn.classList.remove(
                            "actif"
                        );

                    }
                );


                this.classList.add(
                    "actif"
                );


                filtreActuel =
                    this.dataset.filtre;


                appliquerFiltre(
                    filtreActuel
                );

            }
        );

    }
);


/* ===== DÉMARRAGE ===== */

chargerCollection();

appliquerFiltre("toutes");

</script>

</body>
</html>
